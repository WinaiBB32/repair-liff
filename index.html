<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แจ้งซ่อมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Kanit", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans">
    <div
      class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-10"
    >
      <div
        class="bg-blue-600 p-6 text-white rounded-b-3xl text-center shadow-md"
      >
        <h1 class="text-2xl font-bold">🛠️ ใบแจ้งซ่อม</h1>
        <p class="text-blue-100 text-sm mt-1">กรอกข้อมูลให้ครบถ้วน</p>
      </div>

      <form id="repairForm" class="p-6 space-y-4 -mt-4">
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3"
        >
          <h3 class="font-bold text-gray-700 border-b pb-2 text-sm uppercase">
            1. ข้อมูลผู้แจ้ง
          </h3>
          <input
            type="text"
            id="name"
            class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="ชื่อ-นามสกุล"
            required
          />
          <div class="flex gap-2">
            <input
              type="text"
              id="dept"
              class="w-1/2 p-2.5 bg-gray-50 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
              placeholder="หน่วยงาน"
              required
            />
            <input
              type="tel"
              id="phone"
              class="w-1/2 p-2.5 bg-gray-50 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
              placeholder="เบอร์โทร"
              required
            />
          </div>
        </div>

        <div
          class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3"
        >
          <h3 class="font-bold text-gray-700 border-b pb-2 text-sm uppercase">
            2. รายละเอียดงาน
          </h3>
          <input
            type="text"
            id="loc"
            class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="สถานที่ (ตึก/ชั้น/ห้อง)"
            required
          />
          <input
            type="text"
            id="equip"
            class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="ชื่ออุปกรณ์"
            required
          />
          <textarea
            id="desc"
            rows="3"
            class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="อาการเสียอย่างละเอียด"
            required
          ></textarea>
        </div>

        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
          <label class="font-bold text-gray-700 block mb-2 text-sm uppercase"
            >3. รูปภาพประกอบ</label
          >
          <input
            type="file"
            id="img"
            accept="image/*"
            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
          />
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-blue-700 transition transform active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed"
          disabled
        >
          ⏳ กำลังเชื่อมต่อ LINE...
        </button>
      </form>

      <div
        id="loading"
        class="hidden fixed inset-0 bg-black/60 z-50 flex flex-col items-center justify-center backdrop-blur-sm"
      >
        <div
          class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-3"
        ></div>
        <p class="text-white font-bold">กำลังส่งข้อมูล...</p>
      </div>
    </div>

    <script>
      // ============================================
      // ⚙️ ตั้งค่า (อัปเดตล่าสุด)
      // ============================================
      const LIFF_ID = "2008574686-nwaPEvQj";
      const GAS_API =
        "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";
      // ============================================

      async function main() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            document.getElementById("name").value = profile.displayName;

            const btn = document.getElementById("submitBtn");
            btn.disabled = false;
            btn.innerText = "🚀 ยืนยันแจ้งซ่อม";
          } else {
            liff.login();
          }
        } catch (err) {
          alert("LIFF Error: " + err.message);
        }
      }
      main();

      document
        .getElementById("repairForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          document.getElementById("loading").classList.remove("hidden");

          // 1. แปลงรูปภาพ
          let img64 = "",
            imgType = "";
          const f = document.getElementById("img").files[0];
          if (f) {
            if (f.size > 5 * 1024 * 1024) {
              alert("รูปใหญ่เกิน 5MB");
              document.getElementById("loading").classList.add("hidden");
              return;
            }
            imgType = f.type;
            img64 = await new Promise((r) => {
              const rd = new FileReader();
              rd.onload = () => r(rd.result);
              rd.readAsDataURL(f);
            });
          }

          // 2. เตรียมข้อมูล JSON
          const payload = {
            action: "create_ticket",
            data: {
              userId: liff.getDecodedIDToken().sub,
              name: document.getElementById("name").value,
              department: document.getElementById("dept").value,
              phone: document.getElementById("phone").value,
              location: document.getElementById("loc").value,
              equipment: document.getElementById("equipment").value,
              description: document.getElementById("description").value,
              imageBase64: img64,
              imageType: imgType,
            },
          };

          // 3. ส่งข้อมูลไป Google Apps Script
          // ใช้ text/plain เพื่อแก้ปัญหา CORS และรับ Ticket ID กลับมาได้
          fetch(GAS_API, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
          })
            .then((response) => response.json())
            .then((res) => {
              document.getElementById("loading").classList.add("hidden");

              if (res.status === "success" || res.result === "success") {
                const ticket = res.ticketId || "ได้รับข้อมูลแล้ว";

                // ✅ แจ้งเตือนเลข Ticket และปิดหน้าต่างทันที (ไม่ส่งข้อความเข้าแชท)
                alert(
                  `✅ บันทึกสำเร็จ!\n\nเลขที่ใบงาน: ${ticket}\nระบบได้รับข้อมูลเรียบร้อยแล้ว`
                );
                liff.closeWindow();
              } else {
                alert(
                  "❌ บันทึกไม่สำเร็จ: " + (res.message || JSON.stringify(res))
                );
              }
            })
            .catch((err) => {
              document.getElementById("loading").classList.add("hidden");
              alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err);
            });
        });
    </script>
  </body>
</html>
