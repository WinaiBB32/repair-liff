<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แจ้งซ่อมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
  </head>
  <body class="bg-gray-50 min-h-screen font-sans">
    <div
      class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-10"
    >
      <div
        class="bg-indigo-600 p-6 text-white rounded-b-3xl shadow-lg text-center"
      >
        <h1 class="text-2xl font-bold">🛠️ แจ้งซ่อม</h1>
        <p class="text-indigo-100 text-sm mt-1">ระบบบริการงานซ่อมออนไลน์</p>
      </div>

      <form id="repairForm" class="p-6 space-y-4 -mt-2">
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3"
        >
          <div class="flex items-center gap-2 mb-2">
            <div
              class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600"
            >
              👤
            </div>
            <span class="font-bold text-gray-700">ผู้แจ้ง</span>
          </div>
          <input type="hidden" id="userId" />
          <input
            type="text"
            id="name"
            class="w-full p-2 bg-gray-50 rounded border text-sm"
            placeholder="ชื่อ-นามสกุล"
            required
          />
          <div class="grid grid-cols-2 gap-2">
            <input
              type="text"
              id="dept"
              class="w-full p-2 bg-gray-50 rounded border text-sm"
              placeholder="หน่วยงาน"
              required
            />
            <input
              type="tel"
              id="phone"
              class="w-full p-2 bg-gray-50 rounded border text-sm"
              placeholder="เบอร์โทร"
              required
            />
          </div>
        </div>

        <div
          class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3"
        >
          <div class="flex items-center gap-2 mb-2">
            <div
              class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600"
            >
              🔧
            </div>
            <span class="font-bold text-gray-700">รายละเอียด</span>
          </div>
          <input
            type="text"
            id="loc"
            class="w-full p-2 bg-gray-50 rounded border text-sm"
            placeholder="สถานที่ (ตึก/ห้อง)"
            required
          />
          <input
            type="text"
            id="equip"
            class="w-full p-2 bg-gray-50 rounded border text-sm"
            placeholder="ชื่ออุปกรณ์"
            required
          />
          <textarea
            id="desc"
            rows="3"
            class="w-full p-2 bg-gray-50 rounded border text-sm"
            placeholder="อาการเสีย"
            required
          ></textarea>
        </div>

        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
          <label class="block text-sm font-bold text-gray-600 mb-2"
            >📸 รูปภาพประกอบ</label
          >
          <input
            type="file"
            id="imageFile"
            accept="image/*"
            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
          />
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-indigo-700 transition transform active:scale-95 disabled:bg-gray-300 disabled:cursor-not-allowed"
          disabled
        >
          ⏳ กำลังเชื่อมต่อ...
        </button>
      </form>

      <div
        id="loading"
        class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm"
      >
        <div
          class="bg-white p-6 rounded-2xl flex flex-col items-center animate-bounce"
        >
          <div
            class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"
          ></div>
          <p class="mt-3 font-bold text-gray-700">กำลังส่งข้อมูล...</p>
        </div>
      </div>
    </div>

    <script>
      // ============================================
      // ⚙️ ตั้งค่า (แก้ตรงนี้)
      // ============================================
      const LIFF_ID = "2008574686-nwaPEvQj";
      const GAS_API =
        "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";
      // ============================================

      // 1. เริ่มต้น LIFF
      async function main() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          document.getElementById("userId").value = profile.userId;
          document.getElementById("name").value = profile.displayName;

          const btn = document.getElementById("submitBtn");
          btn.disabled = false;
          btn.innerText = "🚀 ส่งแจ้งซ่อม";
        } catch (err) {
          alert("LIFF Error: " + err.message);
        }
      }
      main();

      // 2. จัดการการส่งฟอร์ม
      document
        .getElementById("repairForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const loading = document.getElementById("loading");
          loading.classList.remove("hidden");

          try {
            // แปลงรูปเป็น Base64
            let imgBase64 = "",
              imgType = "";
            const fileInput = document.getElementById("imageFile");
            if (fileInput.files.length > 0) {
              const file = fileInput.files[0];
              if (file.size > 5 * 1024 * 1024)
                throw new Error("รูปใหญ่เกิน 5MB");
              imgType = file.type;
              imgBase64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
              });
            }

            // เตรียมข้อมูล JSON
            const payload = {
              userId: document.getElementById("userId").value,
              name: document.getElementById("name").value,
              department: document.getElementById("dept").value,
              phone: document.getElementById("phone").value,
              location: document.getElementById("loc").value,
              equipment: document.getElementById("equip").value,
              description: document.getElementById("desc").value,
              imageBase64: imgBase64,
              imageType: imgType,
            };

            // ยิงไปหา Google Apps Script
            // fetch mode: 'no-cors' อาจจะไม่ได้รับ response กลับมาแต่จะส่งผ่านแน่นอน
            // แต่ถ้าใช้ script.google.com/macros/s/.../exec โดยตรง ปกติจะรองรับ redirect

            const response = await fetch(GAS_API, {
              method: "POST",
              body: JSON.stringify(payload),
            });

            const result = await response.json(); // อ่านค่าตอบกลับ

            if (result.result === "success") {
              // ส่งข้อความยืนยันเข้าแชท (ใช้ฟีเจอร์ LIFF)
              await liff.sendMessages([
                {
                  type: "text",
                  text: `✅ แจ้งซ่อมสำเร็จ\nTicket: ${result.ticketId}\nอุปกรณ์: ${payload.equipment}\nอาการ: ${payload.description}`,
                },
              ]);
              liff.closeWindow();
            } else {
              throw new Error(result.message || "Unknown Error");
            }
          } catch (err) {
            alert("เกิดข้อผิดพลาด: " + err.message);
            loading.classList.add("hidden");
          }
        });
    </script>
  </body>
</html>
