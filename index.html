<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>แจ้งซ่อมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body { font-family: 'Kanit', sans-serif; }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans">
    <script>
      // ⚠️ ตั้งค่า
      const LIFF_ID = "2008574686-nwaPEvQj";
      const GAS_API =
        "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";

      async function main() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            // ... (โค้ดแสดงชื่อ) ...
            document.getElementById("submitBtn").disabled = false;
          } else {
            liff.login();
          }
        } catch (err) {
          alert("LIFF Error: " + err.message);
        }
      }
      main();

      document
        .getElementById("repairForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          document.getElementById("loading").classList.remove("hidden");

          // ... (โค้ดแปลงรูปภาพ) ...

          const payload = {
            action: "create_ticket",
            data: {
              userId: liff.getDecodedIDToken().sub,
              name: document.getElementById("name").value,
              department: document.getElementById("dept").value,
              phone: document.getElementById("phone").value,
              location: document.getElementById("loc").value,
              equipment: document.getElementById("equipment").value,
              quantity: document.getElementById("qty")?.value || "1", // ✅ แก้ตรงนี้
              description: document.getElementById("description").value,
              imageBase64: img64,
              imageType: imgType,
            },
          };

          fetch(GAS_API, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            credentials: "omit",
          })
            .then((r) => r.json())
            .then((res) => {
              document.getElementById("loading").classList.add("hidden");
              if (res.status === "success") {
                alert(`✅ บันทึกสำเร็จ!\nเลขที่ใบงาน: ${res.ticketId}`);
                liff.closeWindow();
              } else {
                alert("❌ บันทึกไม่สำเร็จ: " + res.message);
              }
            })
            .catch((err) => {
              document.getElementById("loading").classList.add("hidden");
              alert("Error: " + err);
            });
        });
    </script>
  </body>
</html>
