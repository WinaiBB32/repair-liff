<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>แจ้งซ่อมออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-10">
    <div class="bg-blue-600 p-6 text-white rounded-b-3xl text-center shadow-md">
      <h1 class="text-2xl font-bold">🛠️ ใบแจ้งซ่อม</h1>
    </div>

    <form id="repairForm" class="p-6 space-y-4 -mt-4">
      <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3">
        <h3 class="font-bold text-gray-700 border-b pb-2 text-sm">1. ข้อมูลผู้แจ้ง</h3>
        <div class="flex items-center gap-2 bg-gray-100 p-2 rounded text-gray-500 text-xs">
          <i class="fab fa-line text-green-500"></i>
          <span id="lineName">กำลังโหลด...</span>
        </div>
        <input type="text" id="name" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm"
          placeholder="ชื่อ-นามสกุลจริง" required>
        <div class="flex gap-2">
          <input type="text" id="dept" class="w-1/2 p-2.5 bg-gray-50 border rounded-lg text-sm" placeholder="หน่วยงาน"
            required>
          <input type="tel" id="phone" class="w-1/2 p-2.5 bg-gray-50 border rounded-lg text-sm" placeholder="เบอร์โทร"
            required>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3">
        <h3 class="font-bold text-gray-700 border-b pb-2 text-sm">2. รายละเอียดงาน</h3>
        <input type="text" id="loc" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" placeholder="สถานที่"
          required>
        <input type="text" id="equip" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm"
          placeholder="ชื่ออุปกรณ์" required>
        <input type="number" id="qty" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" placeholder="จำนวน"
          value="1" required>
        <textarea id="desc" rows="3" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" placeholder="อาการเสีย"
          required></textarea>
      </div>

      <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
        <label class="font-bold text-gray-700 block mb-2 text-sm">3. รูปภาพ</label>
        <input type="file" id="img" accept="image/*" class="w-full text-sm text-gray-500">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-blue-700 disabled:bg-gray-400"
        disabled>
        ⏳ กำลังเชื่อมต่อ LINE...
      </button>
    </form>

    <div id="loading"
      class="hidden fixed inset-0 bg-black/60 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-3"></div>
      <p class="text-white font-bold">กำลังส่งข้อมูล...</p>
    </div>
  </div>

  <script>
    const LIFF_ID = "2008574686-nwaPEvQj";
    const GAS_API = "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById('lineName').innerText = "LINE: " + profile.displayName; // โชว์ชื่อไลน์
          // document.getElementById('name').value = profile.displayName; // ไม่ Auto-fill ชื่อจริงแล้ว ให้พิมพ์เอง
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('submitBtn').innerText = "🚀 ยืนยันแจ้งซ่อม";
        } else { liff.login(); }
      } catch (err) { alert("LIFF Error: " + err.message); }
    }
    main();

    document.getElementById('repairForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('loading').classList.remove('hidden');

      let img64 = "", imgType = "";
      const f = document.getElementById('img').files[0];
      if (f) {
        if (f.size > 5 * 1024 * 1024) { alert("รูปใหญ่เกิน 5MB"); document.getElementById('loading').classList.add('hidden'); return; }
        imgType = f.type;
        img64 = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(f); });
      }

      const payload = {
        action: 'create_ticket',
        data: {
          userId: liff.getDecodedIDToken().sub,
          name: document.getElementById('name').value,
          department: document.getElementById('dept').value,
          phone: document.getElementById('phone').value,
          location: document.getElementById('loc').value,
          equipment: document.getElementById('equipment').value,
          quantity: document.getElementById('qty').value,
          description: document.getElementById('desc').value,
          imageBase64: img64,
          imageType: imgType
        }
      };

      fetch(GAS_API, {
        method: 'POST',
        redirect: 'follow',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        credentials: 'omit'
      })
        .then(r => r.json())
        .then(res => {
          document.getElementById('loading').classList.add('hidden');
          if (res.status === 'success' || res.result === 'success') {
            alert(`✅ บันทึกสำเร็จ!\nเลขที่ใบงาน: ${res.ticketId}`);
            liff.closeWindow();
          } else {
            alert("❌ บันทึกไม่สำเร็จ: " + (res.message || "Unknown Error"));
          }
        })
        .catch(err => {
          document.getElementById('loading').classList.add('hidden');
          alert("Error: " + err);
        });
    });
  </script>
</body>

</html>
