<!DOCTYPE html>
<html lang="th">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen pb-10">
    <div class="max-w-md mx-auto bg-white shadow-lg min-h-screen">
      <div class="bg-blue-600 p-4 text-white text-center font-bold text-lg">
        🛠️ ใบแจ้งซ่อม
      </div>
      <form id="form" class="p-5 space-y-4">
        <input type="hidden" id="uid" />
        <input
          type="text"
          id="name"
          class="w-full p-2 border rounded"
          placeholder="ชื่อ-นามสกุล"
          required
        />
        <input
          type="text"
          id="dept"
          class="w-full p-2 border rounded"
          placeholder="หน่วยงาน"
          required
        />
        <input
          type="tel"
          id="phone"
          class="w-full p-2 border rounded"
          placeholder="เบอร์โทร"
          required
        />
        <input
          type="text"
          id="loc"
          class="w-full p-2 border rounded"
          placeholder="สถานที่"
          required
        />
        <input
          type="text"
          id="equip"
          class="w-full p-2 border rounded"
          placeholder="ชื่ออุปกรณ์"
          required
        />
        <textarea
          id="desc"
          rows="3"
          class="w-full p-2 border rounded"
          placeholder="อาการเสีย"
          required
        ></textarea>
        <label>รูปภาพ</label
        ><input type="file" id="img" accept="image/*" class="w-full text-sm" />
        <button
          type="submit"
          id="btn"
          class="w-full bg-blue-600 text-white py-3 rounded disabled:bg-gray-400"
          disabled
        >
          Load...
        </button>
      </form>
    </div>
    <script>
      const LIFF_ID = "ใส่_LIFF_ID_ที่นี่";
      async function main() {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const p = await liff.getProfile();
          document.getElementById("name").value = p.displayName;
          document.getElementById("uid").value = p.userId;
          const btn = document.getElementById("btn");
          btn.disabled = false;
          btn.innerText = "ส่งข้อมูล";
        } else liff.login();
      }
      main();
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        document.getElementById("btn").innerText = "Sending...";
        let img64 = null,
          imgType = null;
        const f = document.getElementById("img").files[0];
        if (f) {
          imgType = f.type;
          img64 = await new Promise((r) => {
            const rd = new FileReader();
            rd.onload = () => r(rd.result);
            rd.readAsDataURL(f);
          });
        }

        const data = {
          userId: document.getElementById("uid").value,
          name: document.getElementById("name").value,
          department: document.getElementById("dept").value,
          phone: document.getElementById("phone").value,
          location: document.getElementById("loc").value,
          equipment: document.getElementById("equip").value,
          description: document.getElementById("desc").value,
          imageBase64: img64,
          imageType: imgType,
        };

        fetch(location.href, {
          method: "POST",
          body: JSON.stringify({ action: "create_ticket", data: data }),
        })
          .then((r) => r.json())
          .then((res) => {
            if (res.status === "success") {
              liff
                .sendMessages([
                  {
                    type: "text",
                    text: `📝 แจ้งซ่อมสำเร็จ\nTicket: ${res.ticketId}\nอุปกรณ์: ${data.equipment}`,
                  },
                ])
                .then(() => liff.closeWindow());
            } else alert(res.message);
          });
      };
    </script>
  </body>
</html>
