<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>แจ้งซ่อมออนไลน์</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        font-family: "Kanit", sans-serif;
        background-color: #f3f4f6;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      }
      .input-field {
        transition: all 0.3s ease;
      }
      .input-field:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  </head>
  <body class="text-gray-700">
    <div class="max-w-md mx-auto min-h-screen relative pb-24">
      <div
        class="glass-effect sticky top-0 z-40 shadow-sm px-6 py-4 rounded-b-3xl"
      >
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-xl font-bold text-indigo-900">🛠️ แจ้งซ่อม</h1>
            <p class="text-xs text-gray-500">ระบบบริการงานซ่อมออนไลน์</p>
          </div>
          <div
            id="profileSection"
            class="hidden flex items-center gap-2 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100"
          >
            <img
              id="userImg"
              src=""
              class="w-8 h-8 rounded-full border-2 border-white shadow-sm"
            />
            <span
              id="userNameDisplay"
              class="text-xs font-bold text-indigo-700 truncate max-w-[80px]"
              >...</span
            >
          </div>
        </div>
      </div>

      <form id="repairForm" class="px-5 mt-6 space-y-6">
        <input type="hidden" id="userId" />
        <input type="hidden" id="name" />

        <div
          class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden group hover:shadow-md transition-all duration-300"
        >
          <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
          <h3
            class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-user-circle text-indigo-500 text-lg"></i>
            ข้อมูลผู้แจ้ง
          </h3>

          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2 sm:col-span-1">
              <label class="text-xs text-gray-400 ml-1">หน่วยงาน/แผนก</label>
              <div class="relative">
                <i
                  class="fas fa-building absolute left-3 top-3 text-gray-400 text-xs"
                ></i>
                <input
                  type="text"
                  id="department"
                  class="input-field w-full pl-8 p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                  placeholder="ระบุหน่วยงาน"
                  required
                />
              </div>
            </div>
            <div class="col-span-2 sm:col-span-1">
              <label class="text-xs text-gray-400 ml-1">เบอร์ติดต่อ</label>
              <div class="relative">
                <i
                  class="fas fa-phone absolute left-3 top-3 text-gray-400 text-xs"
                ></i>
                <input
                  type="tel"
                  id="phone"
                  class="input-field w-full pl-8 p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                  placeholder="08x-xxx-xxxx"
                  required
                />
              </div>
            </div>
          </div>
        </div>

        <div
          class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden group hover:shadow-md transition-all duration-300"
        >
          <div class="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>
          <h3
            class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-tools text-orange-500 text-lg"></i>
            รายละเอียดการซ่อม
          </h3>

          <div class="space-y-4">
            <div>
              <label class="text-xs text-gray-400 ml-1">สถานที่เกิดเหตุ</label>
              <input
                type="text"
                id="location"
                class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                placeholder="เช่น อาคาร 1 ชั้น 2 ห้องประชุม"
                required
              />
            </div>

            <div>
              <label class="text-xs text-gray-400 ml-1">ชื่ออุปกรณ์</label>
              <input
                type="text"
                id="equipment"
                class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                placeholder="เช่น เครื่องปรับอากาศ, คอมพิวเตอร์"
                required
              />
            </div>

            <div>
              <label class="text-xs text-gray-400 ml-1"
                >อาการเสีย (ละเอียด)</label
              >
              <textarea
                id="description"
                rows="3"
                class="input-field w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                placeholder="อธิบายอาการที่พบ..."
                required
              ></textarea>
            </div>
          </div>
        </div>

        <div
          class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden"
        >
          <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
          <label
            class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-2"
          >
            <i class="fas fa-camera text-green-500 text-lg"></i> รูปภาพประกอบ
            <span class="text-xs font-normal text-gray-400">(ถ้ามี)</span>
          </label>

          <div class="relative mt-3 group">
            <input
              type="file"
              id="imageFile"
              accept="image/*"
              class="hidden"
              onchange="previewImage(this)"
            />

            <div
              id="uploadBox"
              class="w-full h-32 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 hover:border-indigo-400 transition-colors"
              onclick="document.getElementById('imageFile').click()"
            >
              <div id="placeholder" class="text-center">
                <i
                  class="fas fa-cloud-upload-alt text-3xl text-gray-300 mb-2 group-hover:text-indigo-400 transition"
                ></i>
                <p class="text-xs text-gray-400">แตะเพื่ออัปโหลดรูปภาพ</p>
              </div>
              <img
                id="preview"
                class="hidden h-full w-full object-cover rounded-xl"
              />
            </div>

            <button
              type="button"
              id="removeImgBtn"
              class="hidden absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs shadow-md hover:bg-red-600"
              onclick="removeImage()"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 transform transition hover:-translate-y-1 hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed"
          disabled
        >
          <i class="fas fa-spinner fa-spin mr-2 hidden" id="btnSpinner"></i>
          <span id="btnText">⏳ กำลังเชื่อมต่อ...</span>
        </button>
      </form>

      <div class="text-center mt-8 text-xs text-gray-300 font-light">
        Powered by Your System
      </div>
    </div>

    <div
      id="fullLoader"
      class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center"
    >
      <div class="relative">
        <div
          class="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"
        ></div>
        <i
          class="fas fa-paper-plane absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-indigo-600 text-xl"
        ></i>
      </div>
      <p class="mt-4 text-indigo-800 font-bold animate-pulse">
        กำลังส่งข้อมูล...
      </p>
    </div>

    <script>
      // ============================================
      // ⚙️ ตั้งค่า (อย่าลืมแก้ 2 บรรทัดนี้)
      // ============================================
      const LIFF_ID = "2008574686-nwaPEvQj";
      const GAS_API =
        "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";
      // ============================================

      // ฟังก์ชัน Preview รูป
      function previewImage(input) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.getElementById("preview").src = e.target.result;
            document.getElementById("preview").classList.remove("hidden");
            document.getElementById("placeholder").classList.add("hidden");
            document.getElementById("removeImgBtn").classList.remove("hidden");
            document
              .getElementById("uploadBox")
              .classList.remove("border-2", "border-dashed"); // เอาเส้นปะออก
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      function removeImage() {
        document.getElementById("imageFile").value = "";
        document.getElementById("preview").src = "";
        document.getElementById("preview").classList.add("hidden");
        document.getElementById("placeholder").classList.remove("hidden");
        document.getElementById("removeImgBtn").classList.add("hidden");
        document
          .getElementById("uploadBox")
          .classList.add("border-2", "border-dashed");
      }

      // LIFF Initialization
      async function main() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const profile = await liff.getProfile();

          // Auto Fill & UI Update
          document.getElementById("userId").value = profile.userId;
          document.getElementById("name").value = profile.displayName;

          // Show Profile Section
          document.getElementById("userImg").src = profile.pictureUrl;
          document.getElementById("userNameDisplay").innerText =
            profile.displayName;
          document.getElementById("profileSection").classList.remove("hidden");

          // Enable Button
          const btn = document.getElementById("submitBtn");
          btn.disabled = false;
          document.getElementById("btnText").innerText = "🚀 ยืนยันการแจ้งซ่อม";
        } catch (err) {
          alert("LIFF Error: " + err.message);
        }
      }
      main();

      // Form Submit Handler
      document
        .getElementById("repairForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // UI Loading State
          const btn = document.getElementById("submitBtn");
          const fullLoader = document.getElementById("fullLoader");

          btn.disabled = true;
          document.getElementById("btnSpinner").classList.remove("hidden");
          document.getElementById("btnText").innerText = "กำลังส่งข้อมูล...";
          fullLoader.classList.remove("hidden"); // Show Full Screen Loader

          try {
            // Prepare Image Base64
            let imgBase64 = "",
              imgType = "";
            const fileInput = document.getElementById("imageFile");
            if (fileInput.files.length > 0) {
              const file = fileInput.files[0];
              if (file.size > 5 * 1024 * 1024)
                throw new Error("รูปภาพขนาดใหญ่เกิน 5MB");
              imgType = file.type;
              imgBase64 = await new Promise((r) => {
                const reader = new FileReader();
                reader.onload = () => r(reader.result);
                reader.readAsDataURL(file);
              });
            }

            // Payload Data
            const payload = {
              action: "create_ticket",
              data: {
                userId: document.getElementById("userId").value,
                name: document.getElementById("name").value,
                department: document.getElementById("department").value,
                phone: document.getElementById("phone").value,
                location: document.getElementById("location").value,
                equipment: document.getElementById("equipment").value,
                description: document.getElementById("description").value,
                imageBase64: imgBase64,
                imageType: imgType,
              },
            };

            // Send to Google Apps Script
            const response = await fetch(GAS_API, {
              method: "POST",
              body: JSON.stringify(payload),
            });

            const result = await response.json();

            if (result.status === "success") {
              // Success: Close Window & Notify
              await liff.sendMessages([
                {
                  type: "text",
                  text: `✅ แจ้งซ่อมสำเร็จ\nTicket: ${result.ticketId}\nอุปกรณ์: ${payload.data.equipment}`,
                },
              ]);
              liff.closeWindow();
            } else {
              throw new Error(result.message);
            }
          } catch (err) {
            alert("เกิดข้อผิดพลาด: " + err.message);
            // Reset UI
            btn.disabled = false;
            document.getElementById("btnSpinner").classList.add("hidden");
            document.getElementById("btnText").innerText =
              "🚀 ยืนยันการแจ้งซ่อม";
            fullLoader.classList.add("hidden");
          }
        });
    </script>
  </body>
</html>
