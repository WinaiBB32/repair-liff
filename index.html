<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>แจ้งซ่อมออนไลน์</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f3f4f6;
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body class="text-gray-700">

  <div class="max-w-md mx-auto min-h-screen relative pb-24">

    <div class="glass-effect sticky top-0 z-40 shadow-sm px-6 py-4 rounded-b-3xl">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-indigo-900">🛠️ ใบแจ้งซ่อม</h1>
          <p class="text-xs text-gray-500">กรุณากรอกข้อมูลให้ครบถ้วน</p>
        </div>
        <div id="profileSection" class="hidden">
          <img id="userImg" src="" class="w-10 h-10 rounded-full border-2 border-indigo-100 shadow-sm">
        </div>
      </div>
    </div>

    <form id="repairForm" class="px-5 mt-6 space-y-6">

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
        <h3 class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i class="fas fa-user-circle text-indigo-500 text-lg"></i> ข้อมูลผู้แจ้ง
        </h3>

        <div class="space-y-3">
          <div class="bg-gray-100 p-2 rounded-lg flex items-center gap-2 border border-gray-200">
            <i class="fab fa-line text-green-500 text-xl"></i>
            <div class="overflow-hidden">
              <p class="text-[10px] text-gray-400">แจ้งโดยบัญชี LINE:</p>
              <p id="lineDisplayName" class="text-sm font-bold text-gray-600 truncate">กำลังโหลด...</p>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-400 ml-1">ชื่อ-นามสกุล (สำหรับติดต่อ)</label>
            <input type="text" id="name"
              class="w-full p-2.5 bg-white border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
              placeholder="ระบุชื่อ-นามสกุลจริง" required>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-xs text-gray-400 ml-1">หน่วยงาน</label>
              <input type="text" id="department" class="w-full p-2.5 bg-white border border-gray-300 rounded-xl text-sm"
                placeholder="ระบุหน่วยงาน" required>
            </div>
            <div>
              <label class="text-xs text-gray-400 ml-1">เบอร์โทร</label>
              <input type="tel" id="phone" class="w-full p-2.5 bg-white border border-gray-300 rounded-xl text-sm"
                placeholder="เบอร์ติดต่อ" required>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>
        <h3 class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i class="fas fa-tools text-orange-500 text-lg"></i> รายละเอียดงาน
        </h3>
        <div class="space-y-4">
          <div>
            <label class="text-xs text-gray-400 ml-1">สถานที่</label>
            <input type="text" id="location" class="w-full p-2.5 bg-white border border-gray-300 rounded-xl text-sm"
              placeholder="ตึก / ชั้น / ห้อง" required>
          </div>

          <div class="flex gap-2">
            <div class="w-2/3">
              <label class="text-xs text-gray-400 ml-1">อุปกรณ์</label>
              <input type="text" id="equipment" class="w-full p-2.5 bg-white border border-gray-300 rounded-xl text-sm"
                placeholder="ชื่ออุปกรณ์" required>
            </div>
            <div class="w-1/3">
              <label class="text-xs text-gray-400 ml-1">จำนวน</label>
              <input type="number" id="qty"
                class="w-full p-2.5 bg-white border border-gray-300 rounded-xl text-sm text-center" value="1" required>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-400 ml-1">อาการเสีย</label>
            <textarea id="description" rows="3" class="w-full p-3 bg-white border border-gray-300 rounded-xl text-sm"
              placeholder="ระบุอาการอย่างละเอียด" required></textarea>
          </div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
        <label class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-2">
          <i class="fas fa-camera text-green-500 text-lg"></i> รูปภาพประกอบ <span class="text-red-500">*</span>
        </label>

        <div class="relative mt-3 group">
          <input type="file" id="img" accept="image/*" class="hidden" onchange="previewImage(this)" required>
          <div id="uploadBox"
            class="w-full h-32 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition"
            onclick="document.getElementById('img').click()">
            <div id="placeholder" class="text-center">
              <i class="fas fa-cloud-upload-alt text-2xl text-gray-300 mb-2"></i>
              <p class="text-xs text-gray-400">แตะเพื่อเลือกรูปภาพ</p>
            </div>
            <img id="preview" class="hidden h-full w-full object-cover rounded-xl">
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed"
        disabled>
        ⏳ กำลังเชื่อมต่อ LINE...
      </button>

    </form>
  </div>

  <div id="loading"
    class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-100 border-t-indigo-600 mb-4"></div>
    <p class="text-indigo-800 font-bold animate-pulse">กำลังส่งข้อมูล...</p>
  </div>

  <script>
    // ============================================
    // ⚙️ ตั้งค่า
    // ============================================
    const LIFF_ID = "2008574686-nwaPEvQj";
    const GAS_API = "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";
    // ============================================

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').classList.remove('hidden');
          document.getElementById('placeholder').classList.add('hidden');
          document.getElementById('uploadBox').classList.remove('border-2', 'border-dashed');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();

          // แสดงชื่อ LINE (แต่ไม่เอาไปใส่ในช่อง input ที่ส่งข้อมูล)
          document.getElementById('lineDisplayName').innerText = profile.displayName;
          document.getElementById('userImg').src = profile.pictureUrl;
          document.getElementById('profileSection').classList.remove('hidden');

          const btn = document.getElementById('submitBtn');
          btn.disabled = false;
          btn.innerText = "🚀 ยืนยันการแจ้งซ่อม";
        } else {
          liff.login();
        }
      } catch (err) {
        alert("LIFF Error: " + err.message);
      }
    }
    main();

    // ฟังก์ชันย่อรูป (Resize)
    const resizeImage = (file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width;
          let height = img.height;
          if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } }
          else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('repairForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const f = document.getElementById('img').files[0];
      if (!f) { alert("กรุณาแนบรูปภาพ"); return; }

      document.getElementById('loading').classList.remove('hidden');

      try {
        // ย่อรูป
        const resizedBase64 = await resizeImage(f);
        const finalBase64 = resizedBase64.split(',')[1];

        const payload = {
          action: 'create_ticket',
          data: {
            userId: liff.getDecodedIDToken().sub,
            name: document.getElementById('name').value, // ชื่อจริงที่พิมพ์เอง
            department: document.getElementById('department').value,
            phone: document.getElementById('phone').value,
            location: document.getElementById('location').value,
            equipment: document.getElementById('equipment').value,
            quantity: document.getElementById('qty').value, // ✅ อ่านค่าจากช่องจำนวน (ไม่ Null แล้ว)
            description: document.getElementById('description').value,
            imageBase64: finalBase64,
            imageType: 'image/jpeg'
          }
        };

        fetch(GAS_API, {
          method: 'POST',
          redirect: 'follow',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          credentials: 'omit' // ✅ แก้ปัญหา iOS Load Failed
        })
          .then(r => r.json())
          .then(res => {
            document.getElementById('loading').classList.add('hidden');
            if (res.status === 'success' || res.result === 'success') {
              alert(`✅ บันทึกสำเร็จ!\nเลขที่ใบงาน: ${res.ticketId}`);
              liff.closeWindow();
            } else {
              alert("❌ บันทึกไม่สำเร็จ: " + (res.message || "Unknown Error"));
            }
          })
          .catch(err => {
            document.getElementById('loading').classList.add('hidden');
            alert("Connection Error: " + err);
          });

      } catch (error) {
        document.getElementById('loading').classList.add('hidden');
        alert("System Error: " + error);
      }
    });
  </script>
</body>

</html>
