<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>แจ้งซ่อมออนไลน์</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        font-family: "Kanit", sans-serif;
        background-color: #f3f4f6;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      }
      .input-field {
        transition: all 0.3s ease;
      }
      .input-field:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
    </style>
  </head>
  <body class="text-gray-700">
    <div class="max-w-md mx-auto min-h-screen relative pb-24">
      <div
        class="glass-effect sticky top-0 z-40 shadow-sm px-6 py-4 rounded-b-3xl"
      >
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-xl font-bold text-indigo-900">🛠️ แจ้งซ่อม</h1>
            <p class="text-xs text-gray-500">ระบบบริการงานซ่อมออนไลน์</p>
          </div>
          <div
            id="profileSection"
            class="hidden flex items-center gap-2 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100"
          >
            <img
              id="userImg"
              src=""
              class="w-8 h-8 rounded-full border-2 border-white shadow-sm"
            />
            <span
              id="userNameDisplay"
              class="text-xs font-bold text-indigo-700 truncate max-w-[80px]"
              >...</span
            >
          </div>
        </div>
      </div>

      <form id="repairForm" class="px-5 mt-6 space-y-6">
        <div
          class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden"
        >
          <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
          <h3
            class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-user-circle text-indigo-500 text-lg"></i>
            ข้อมูลผู้แจ้ง
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
              <input
                type="text"
                id="name"
                class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                placeholder="ชื่อ-นามสกุล"
                required
              />
            </div>
            <div>
              <input
                type="text"
                id="department"
                class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                placeholder="หน่วยงาน"
                required
              />
            </div>
            <div>
              <input
                type="tel"
                id="phone"
                class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
                placeholder="เบอร์โทร"
                required
              />
            </div>
          </div>
        </div>

        <div
          class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden"
        >
          <div class="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>
          <h3
            class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-tools text-orange-500 text-lg"></i> รายละเอียดงาน
          </h3>
          <div class="space-y-4">
            <input
              type="text"
              id="location"
              class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
              placeholder="สถานที่ (ตึก/ชั้น/ห้อง)"
              required
            />
            <input
              type="text"
              id="equipment"
              class="input-field w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"
              placeholder="ชื่ออุปกรณ์"
              required
            />
            <textarea
              id="description"
              rows="3"
              class="input-field w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm"
              placeholder="อาการเสียอย่างละเอียด"
              required
            ></textarea>
          </div>
        </div>

        <div
          class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden"
        >
          <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
          <label
            class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-2"
          >
            <i class="fas fa-camera text-green-500 text-lg"></i> รูปภาพประกอบ
          </label>

          <div class="relative mt-3 group">
            <input
              type="file"
              id="imageFile"
              accept="image/*"
              class="hidden"
              onchange="previewImage(this)"
            />
            <div
              id="uploadBox"
              class="w-full h-32 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition"
              onclick="document.getElementById('imageFile').click()"
            >
              <div id="placeholder" class="text-center">
                <i
                  class="fas fa-cloud-upload-alt text-2xl text-gray-300 mb-2"
                ></i>
                <p class="text-xs text-gray-400">แตะเพื่อเลือกรูปภาพ</p>
              </div>
              <img
                id="preview"
                class="hidden h-full w-full object-cover rounded-xl"
              />
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed"
          disabled
        >
          ⏳ กำลังเชื่อมต่อ LINE...
        </button>
      </form>
    </div>

    <div
      id="loading"
      class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center"
    >
      <div
        class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-100 border-t-indigo-600 mb-4"
      ></div>
      <p class="text-indigo-800 font-bold animate-pulse">กำลังส่งข้อมูล...</p>
    </div>

    <script>
      // ============================================
      // ⚙️ ตั้งค่า (อัปเดตล่าสุด)
      // ============================================
      const LIFF_ID = "2008574686-nwaPEvQj";
      const GAS_API =
        "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";
      // ============================================

      // Preview Image
      function previewImage(input) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.getElementById("preview").src = e.target.result;
            document.getElementById("preview").classList.remove("hidden");
            document.getElementById("placeholder").classList.add("hidden");
            document
              .getElementById("uploadBox")
              .classList.remove("border-2", "border-dashed");
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      async function main() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            // Auto fill name
            document.getElementById("name").value = profile.displayName;

            // Show Profile
            document.getElementById("userImg").src = profile.pictureUrl;
            document.getElementById("userNameDisplay").innerText =
              profile.displayName;
            document
              .getElementById("profileSection")
              .classList.remove("hidden");

            // Enable Button
            const btn = document.getElementById("submitBtn");
            btn.disabled = false;
            btn.innerText = "🚀 ยืนยันการแจ้งซ่อม";
          } else {
            liff.login();
          }
        } catch (err) {
          alert("LIFF Error: " + err.message);
        }
      }
      main();

      document
        .getElementById("repairForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          document.getElementById("loading").classList.remove("hidden");

          // 1. Convert Image
          let img64 = "",
            imgType = "";
          const f = document.getElementById("imageFile").files[0];
          if (f) {
            if (f.size > 5 * 1024 * 1024) {
              alert("รูปใหญ่เกิน 5MB");
              document.getElementById("loading").classList.add("hidden");
              return;
            }
            imgType = f.type;
            img64 = await new Promise((r) => {
              const rd = new FileReader();
              rd.onload = () => r(rd.result);
              rd.readAsDataURL(f);
            });
          }

          // 2. Prepare Data
          const payload = {
            action: "create_ticket",
            data: {
              userId: liff.getDecodedIDToken().sub,
              name: document.getElementById("name").value,
              department: document.getElementById("department").value,
              phone: document.getElementById("phone").value,
              location: document.getElementById("location").value,
              equipment: document.getElementById("equipment").value,
              description: document.getElementById("description").value,
              imageBase64: img64,
              imageType: imgType,
            },
          };

          // 3. Send to Google Apps Script
          fetch(GAS_API, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
          })
            .then((response) => response.json())
            .then((res) => {
              document.getElementById("loading").classList.add("hidden");

              if (res.status === "success" || res.result === "success") {
                const ticket = res.ticketId || "ได้รับข้อมูลแล้ว";

                // ✅ แจ้งเตือนเลข Ticket และปิดหน้าต่างทันที (ไม่ส่งเข้าแชท)
                alert(
                  `✅ บันทึกสำเร็จ!\n\nเลขที่ใบงาน: ${ticket}\nระบบได้รับข้อมูลเรียบร้อยแล้ว`
                );
                liff.closeWindow();
              } else {
                alert(
                  "❌ บันทึกไม่สำเร็จ: " + (res.message || JSON.stringify(res))
                );
              }
            })
            .catch((err) => {
              document.getElementById("loading").classList.add("hidden");
              alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err);
            });
        });
    </script>
  </body>
</html>
