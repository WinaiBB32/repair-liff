<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>แจ้งซ่อมออนไลน์</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f3f4f6;
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .input-field:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
  </style>
</head>

<body class="text-gray-700">

  <div class="max-w-md mx-auto min-h-screen relative pb-24">

    <div class="glass-effect sticky top-0 z-40 shadow-sm px-6 py-4 rounded-b-3xl">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-indigo-900">🛠️ ใบแจ้งซ่อม</h1>
          <p class="text-xs text-gray-500">กรุณากรอกข้อมูลให้ครบถ้วน</p>
        </div>
        <div id="profileSection" class="hidden">
          <img id="userImg" src="" class="w-10 h-10 rounded-full border-2 border-indigo-100 shadow-sm">
        </div>
      </div>
    </div>

    <form id="repairForm" class="px-5 mt-6 space-y-5">

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
        <h3 class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i class="fas fa-user-circle text-indigo-500 text-lg"></i> ข้อมูลผู้แจ้ง
        </h3>

        <div class="space-y-3">
          <div class="bg-gray-50 p-2 rounded-lg flex items-center gap-3 border border-gray-200">
            <i class="fab fa-line text-green-500 text-xl"></i>
            <div class="overflow-hidden">
              <p class="text-[10px] text-gray-400">บัญชี LINE:</p>
              <p id="lineDisplayName" class="text-sm font-bold text-gray-600 truncate">กำลังโหลด...</p>
            </div>
          </div>

          <input type="text" id="name"
            class="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
            placeholder="ระบุชื่อ-นามสกุลจริง" required>

          <div class="flex gap-2">
            <input type="text" id="dept" class="w-1/2 p-2.5 bg-white border border-gray-200 rounded-xl text-sm"
              placeholder="หน่วยงาน" required>
            <input type="tel" id="phone" class="w-1/2 p-2.5 bg-white border border-gray-200 rounded-xl text-sm"
              placeholder="เบอร์ติดต่อ" required>
          </div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>
        <h3 class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i class="fas fa-tools text-orange-500 text-lg"></i> รายละเอียดงาน
        </h3>
        <div class="space-y-4">
          <input type="text" id="loc" class="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-sm"
            placeholder="สถานที่ (ตึก / ชั้น / ห้อง)" required>

          <div class="flex gap-2">
            <div class="w-2/3">
              <select id="equip"
                class="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-blue-500 appearance-none"
                required>
                <option value="" disabled selected>เลือกประเภทปัญหา</option>
                <option value="ไฟฟ้า/แสงสว่าง">💡 ไฟฟ้า/แสงสว่าง</option>
                <option value="ประปา/สุขภัณฑ์">🚰 ประปา/สุขภัณฑ์</option>
                <option value="เครื่องปรับอากาศ">❄️ เครื่องปรับอากาศ</option>
                <option value="อาคาร/สถานที่">🏢 อาคาร/สถานที่</option>
                <option value="ครุภัณฑ์สำนักงาน">🪑 ครุภัณฑ์สำนักงาน</option>
                <option value="ยานพาหนะ">🚗 ยานพาหนะ</option>
                <option value="อื่นๆ">🔧 อื่นๆ</option>
              </select>
            </div>
            <div class="w-1/3">
              <input type="number" id="qty"
                class="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-sm text-center" value="1" required>
            </div>
          </div>

          <textarea id="desc" rows="3" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm"
            placeholder="ระบุอาการอย่างละเอียด" required></textarea>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
        <label class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-2">
          <i class="fas fa-camera text-green-500 text-lg"></i> รูปภาพประกอบ <span class="text-red-500">*</span>
        </label>

        <div class="relative mt-3 group">
          <input type="file" id="img" accept="image/*" class="hidden" onchange="previewImage(this)" required>
          <div id="uploadBox"
            class="w-full h-32 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 hover:border-indigo-400 transition"
            onclick="document.getElementById('img').click()">
            <div id="placeholder" class="text-center">
              <i class="fas fa-cloud-upload-alt text-3xl text-gray-300 mb-2 group-hover:text-indigo-400 transition"></i>
              <p class="text-xs text-gray-400">แตะเพื่อเลือกรูปภาพ</p>
            </div>
            <img id="preview" class="hidden h-full w-full object-cover rounded-xl">
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed"
        disabled>
        ⏳ กำลังเชื่อมต่อ LINE...
      </button>

    </form>
  </div>

  <div id="loading"
    class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-100 border-t-indigo-600 mb-4"></div>
    <p class="text-indigo-800 font-bold animate-pulse">กำลังส่งข้อมูล...</p>
    <p class="text-gray-500 text-xs mt-2">(กำลังย่อรูปภาพ...)</p>
  </div>

  <script>
    // ============================================
    // ⚙️ ตั้งค่า (ตรวจสอบ LIFF ID และ URL ให้ถูกต้อง)
    // ============================================
    const LIFF_ID = "2008574686-nwaPEvQj";
    const GAS_API = "https://script.google.com/macros/s/AKfycbwL8pWR4T3YJ_8F8ukmvj5IBtl6yKFYXfUh_cRcoVzK_wjE5PvSnHJ9e9yJCYwUaXIzEQ/exec";
    // ============================================

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').classList.remove('hidden');
          document.getElementById('placeholder').classList.add('hidden');
          document.getElementById('uploadBox').classList.remove('border-2', 'border-dashed');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    // ฟังก์ชันย่อรูป (สำคัญมาก! ช่วยให้มือถือไม่ค้าง)
    const resizeImage = (file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800; // ย่อเหลือ 800px
          let width = img.width; let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          // คืนค่า Base64 (Quality 0.7)
          resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]); // ตัด Header ออกให้เลย
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById('lineDisplayName').innerText = profile.displayName;
          document.getElementById('userImg').src = profile.pictureUrl;
          document.getElementById('profileSection').classList.remove('hidden');

          const btn = document.getElementById('submitBtn');
          btn.disabled = false;
          btn.innerText = "🚀 ยืนยันการแจ้งซ่อม";
        } else {
          liff.login();
        }
      } catch (err) {
        alert("LIFF Error: " + err.message);
      }
    }

    // รันเมื่อหน้าเว็บโหลดเสร็จ
    window.onload = main;

    document.getElementById('repairForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const f = document.getElementById('img').files[0];
      if (!f) { alert("กรุณาแนบรูปภาพ"); return; }

      document.getElementById('loading').classList.remove('hidden');

      try {
        // 1. ย่อรูป
        const finalBase64 = await resizeImage(f);

        // 2. เตรียมข้อมูล (ดักจับ Error ช่อง qty)
        const qtyInput = document.getElementById('qty');
        const qtyValue = qtyInput ? qtyInput.value : '1';

        const payload = {
          action: 'create_ticket',
          data: {
            userId: liff.getDecodedIDToken().sub,
            name: document.getElementById('name').value,
            department: document.getElementById('dept').value,
            phone: document.getElementById('phone').value,
            location: document.getElementById('loc').value,
            equipment: document.getElementById('equip').value,
            quantity: qtyValue,
            description: document.getElementById('desc').value,
            imageBase64: finalBase64,
            imageType: 'image/jpeg'
          }
        };

        // 3. ส่งข้อมูลด้วย jQuery AJAX (เสถียรสุดสำหรับ iOS/Android)
        $.ajax({
          url: GAS_API,
          type: "POST",
          data: JSON.stringify(payload),
          contentType: "text/plain;charset=utf-8",
          dataType: "json",
          success: function (res) {
            document.getElementById('loading').classList.add('hidden');
            if (res.status === 'success' || res.result === 'success') {
              alert(`✅ บันทึกสำเร็จ!\nเลขที่ใบงาน: ${res.ticketId}`);
              liff.closeWindow();
            } else {
              alert("❌ บันทึกไม่สำเร็จ: " + (res.message || "Unknown Error"));
            }
          },
          error: function (err) {
            document.getElementById('loading').classList.add('hidden');
            const msg = err.responseJSON ? err.responseJSON.message : err.statusText;
            alert("Connection Error: " + msg);
          }
        });

      } catch (error) {
        document.getElementById('loading').classList.add('hidden');
        alert("System Error: " + error);
      }
    });
  </script>
</body>

</html>
